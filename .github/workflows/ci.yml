name: ci

on:
  push:
    branches: [master, ticket/**]
  pull_request:
    branches: [master]

jobs:
  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: setup golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin to v2.5.0: the v1.x line (max v1.64.8) is built with the Go 1.24
          # toolchain and refuses to parse a go.mod declaring `go 1.25`. The
          # .golangci-lint v2 line requires golangci-lint-action v7+, so we
          # bump from v6 to v8 (the current major that documents v2 support).
          # .golangci.yml is already in v2 config format.
          version: v2.5.0

      - name: go env
        run: go env GOOS GOARCH

      - name: build
        run: make build

  test:
    name: test (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        exclude:
          - os: macos-latest
            arch: amd64
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: setup golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin to v2.5.0: the v1.x line (max v1.64.8) is built with the Go 1.24
          # toolchain and refuses to parse a go.mod declaring `go 1.25`. The
          # .golangci-lint v2 line requires golangci-lint-action v7+, so we
          # bump from v6 to v8 (the current major that documents v2 support).
          # .golangci.yml is already in v2 config format.
          version: v2.5.0

      - name: check
        run: make check
