# boundaries.yaml — declarative import-boundary rules for notebooklm-go.
#
# This file mirrors docs/AGENTS.md rule 5. The `internal/tools/boundarycheck`
# tool reads it on every `make check` and rejects any import that violates a
# row below.
#
# Schema:
#   schema_version: integer; bump when the field set changes.
#   packages: list of rule entries, one per governed package.
#     path:  fully-qualified Go import path of the governed package.
#     mode:  "internal" — every import path must start with the module's
#                          own root (i.e. only sibling internal/* packages).
#            "stdlib"    — every import must be a Go standard-library
#                          package; nothing else is allowed.
#
# A package that does not yet exist on disk is silently skipped (we cannot
# lint what has not been written). This keeps `make boundarycheck` green
# during the early phases when only some packages have been scaffolded.
schema_version: 1

packages:
  - path: github.com/raihankhan/notebooklm-go/internal/app
    mode: internal

  - path: github.com/raihankhan/notebooklm-go/internal/cli
    mode: internal

  - path: github.com/raihankhan/notebooklm-go/internal/mcpsrv
    mode: internal

  - path: github.com/raihankhan/notebooklm-go/internal/restsrv
    mode: internal

  # `internal/web/wire` is the single JSON adapter — docs/AGENTS.md rule 3
  # permits exactly one importer of encoding/json, and this is it. Everything
  # else must go through wire.Marshal / wire.Unmarshal.
  - path: github.com/raihankhan/notebooklm-go/internal/web/wire
    mode: stdlib

  # `internal/web/policy` is the IdempotencyRegistry — the gate the transport
  # uses to decide whether a batchexecute RPC is replay-safe. It imports
  # `internal/web/wire` (for the Method table) and stdlib, and nothing else;
  # misclassification would either retry a destructive call (duplicate
  # side effects) or refuse to retry a safe one (visible flake), so this
  # package must remain free of app-layer and transport-layer imports.
  - path: github.com/raihankhan/notebooklm-go/internal/web/policy
    mode: internal

  # `internal/redact` is the credential-masking primitive (T-P0-3). It is
  # leaf by policy: stdlib only, no third-party imports, no module-internal
  # imports. Everything that needs to mask a credential routes through it.
  - path: github.com/raihankhan/notebooklm-go/internal/redact
    mode: stdlib

  # `internal/logging` is the stderr-only slog handler (T-P0-2). It may
  # import the redact primitive but nothing else inside `internal/` —
  # loggers are intentionally cheap to embed and must not depend on the
  # application-layer packages.
  - path: github.com/raihankhan/notebooklm-go/internal/logging
    mode: internal

# `internal/auth/cookiejar` is the RFC 6265 cookie store the
  # transport kernel holds (T-P2-1). It imports the redaction
  # primitive so Cookie.String() / HeaderFor() never leak a value to
  # a log or error sink, and nothing else inside `internal/`. The
  # public-suffix check is implemented inline rather than via
  # golang.org/x/net/publicsuffix so this package stays stdlib-only.
  - path: github.com/raihankhan/notebooklm-go/internal/auth/cookiejar
    mode: internal

  # `internal/atomicio` is the atomic-write primitive (T-P2-4). Leaf by
  # policy: stdlib only, no module-internal imports (the helpers exist
  # precisely so callers don't have to roll their own temp+chmod+rename
  # dance). Cross-process flock is built on syscall.Flock (POSIX) with a
  # Windows stub gated behind //go:build windows; no third-party lock
  # library is allowed here, so this row stays stdlib.
  - path: github.com/raihankhan/notebooklm-go/internal/atomicio
    mode: stdlib

  # `internal/paths` resolves ~/.notebooklm/, profile dirs, and the
  # config.json sidecar. It imports internal/atomicio (for the mkdir-all
  # helper used by some lookups) and nothing else inside the module;
  # path resolution must stay free of app-layer and transport-layer
  # imports so every package can import it.
  - path: github.com/raihankhan/notebooklm-go/internal/paths
    mode: internal

  # `internal/auth/storage` is the storage_state.json read/write layer
  # (T-P2-2). It owns the lossless round-trip and the Python-CLI
  # import normalizers (expirationDate → expires, sameSite case
  # forms, bare cookie arrays, origins dropped, the in-band
  # notebooklm.account namespace, and the legacy context.json
  # promotion). The package is mode=internal: stdlib +
  # internal/web/wire (the single JSON adapter) and nothing else —
  # third-party dependencies would not survive an audit on a credential
  # file, and the cookie-jar package already imports nothing
  # third-party so storage stays symmetric.
  - path: github.com/raihankhan/notebooklm-go/internal/auth/storage
    mode: internal

  # `internal/auth/policy` is the cookie-domain allowlist, the
  # MinimumRequiredCookies set, the Tier 2 secondary-binding matrix,
  # and the typed Validate entry point the refresh ladder in Phase 4
  # switches on (T-P2-3). The package is mode=internal: stdlib +
  # internal/redact (so the diagnostic messages that name cookie names
  # route through the credential primitive) + internal/auth/cookiejar
  # (for the Jar type passed to Validate). No third-party dependencies;
  # the cookie-jar package stays the only credential-aware data
  # structure policy talks to, and every other credential surface
  # (storage, browser, master-token) goes through cookie-jar, not
  # through policy.
  - path: github.com/raihankhan/notebooklm-go/internal/auth/policy
    mode: internal

  # `internal/runtime` is the Lifecycle, Supervisor, Metrics, and
  # deadline.Budget primitives (T-P3-1) used by every later
  # transport call. The package is mode=stdlib: only Go standard
  # library packages — no third-party dependencies (a deadlock
  # here stops the whole binary, so the dependency surface is
  # deliberately the smallest possible) and no module-internal
  # imports. Credential material does not appear in this package
  # at all; the redaction primitive stays out of the import graph
  # so a redact bug cannot cascade into the lifecycle primitive.
  - path: github.com/raihankhan/notebooklm-go/internal/runtime
    mode: stdlib
