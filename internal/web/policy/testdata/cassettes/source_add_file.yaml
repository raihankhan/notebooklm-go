# Cassette for T-S3-004c: source_add File branch.
#
# The fixture replays the `AddSourceFile` (`o4cbdc`) invocation
# the `SourcesAPI.AddFile` path issues. The response body is
# the chunked-wire chunk the Go batchexecute parser consumes
# (one wrb.fr frame whose rpc id is `o4cbdc`); the result
# payload is the freshly added source row (medium-nested shape
# — outer[0] is the entry row, the entry itself is
# `[id_envelope, title, …]`) so the test exercises the decode
# path end-to-end.
#
# The File branch differs from URL / YouTube / Text / Drive in
# two load-bearing ways: the wire envelope is a 3-slot
# `[[filename]], notebook_id, TPL` shape (NOT a 3-slot envelope
# with a source-spec inner list), and the actual file bytes
# do NOT ride on this spec — they stream via the Scotty upload
# protocol (T-S3-005a). The T-S3-004c builder issues the
# `AddSourceFile` RPC to register the source row; the upload
# phase is a follow-up.
#
# The request body is the URL-encoded `f.req=…` form the
# batchexecute protocol expects. The decoded payload is the
# 3-slot file envelope (filename at slot 0 wrapped in a
# single-element list, notebook id at slot 1, template block
# at slot 2).
#
# Header values are single-string maps because the go-vcr v4 cassette
# struct unmarshals headers as map[string][]string — a scalar value
# is rejected with "cannot construct !!str into []string".
---
version: 2
interactions:
  - request:
      method: POST
      url: https://notebooklm.google.com/_/LabsTailwindUi/data/batchexecute
      headers:
        Cookie:
          - SCRUBBED
        Content-Type:
          - application/x-www-form-urlencoded
      body: 'f.req=%5B%5B%5B%22o4cbdc%22%2C%5B%5B%5B%22report.pdf%22%5D%5D%2C%22nb-1%22%2C%5B2%2Cnull%2Cnull%2C%5B1%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2C%5B1%5D%5D%5D%5D%2Cnull%2Cnull%2Cnull%2C%221%22%5D%5D%5D'
    response:
      code: 200
      headers:
        Content-Type:
          - application/json
      body: |
        [["wrb.fr","o4cbdc","[[[\"src-file\",\"report.pdf\",[null,null,null,null,4,null,null,null],[null,2]]]]",null,null,null,"generic"]]