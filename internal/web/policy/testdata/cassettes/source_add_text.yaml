# Cassette for T-S3-004c: source_add Text branch.
#
# The fixture replays the `AddSources` (`izAoDd`) invocation the
# `SourcesAPI.AddText` path issues. The response body is the
# chunked-wire chunk the Go batchexecute parser consumes (one
# wrb.fr frame whose rpc id is `izAoDd`); the result payload is
# the freshly added source row (medium-nested shape — outer[0]
# is the entry row, the entry itself is `[id_envelope, title, …]`)
# so the test exercises the decode path end-to-end.
#
# The Text branch differs from the URL / YouTube branches in
# two load-bearing positions: the [title, content] pair rides
# at source-spec slot 1 (the text-branch discriminator), and
# the type marker `2` rides at source-spec slot 3 (the
# load-bearing branch selector). The slot shift + type marker
# is how the backend dispatches the text branch without an
# explicit type code on the spec.
#
# The request body is the URL-encoded `f.req=…` form the
# batchexecute protocol expects. The decoded payload is the
# 11-slot text-branch spec at slot 0 ([title, content] at
# source-spec slot 1, type marker 2 at source-spec slot 3,
# source-type code at source-spec slot 10), the notebook id
# at slot 1, and the nested template block at slot 2.
#
# Header values are single-string maps because the go-vcr v4 cassette
# struct unmarshals headers as map[string][]string — a scalar value
# is rejected with "cannot construct !!str into []string".
---
version: 2
interactions:
  - request:
      method: POST
      url: https://notebooklm.google.com/_/LabsTailwindUi/data/batchexecute
      headers:
        Cookie:
          - SCRUBBED
        Content-Type:
          - application/x-www-form-urlencoded
      body: 'f.req=%5B%5B%5B%22izAoDd%22%2C%5B%5B%5Bnull%2C%5B%22Pasted%20text%22%2C%22Hello%20world%22%5D%2Cnull%2C2%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2C1%5D%5D%2C%22nb-1%22%2C%5B2%2Cnull%2Cnull%2C%5B1%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2C%5B1%5D%5D%5D%5D%2Cnull%2Cnull%2Cnull%2C%221%22%5D%5D%5D'
    response:
      code: 200
      headers:
        Content-Type:
          - application/json
      body: |
        [["wrb.fr","izAoDd","[[[\"src-text\",\"Pasted text\",[null,null,null,null,3,null,null,null],[null,2]]]]",null,null,null,"generic"]]