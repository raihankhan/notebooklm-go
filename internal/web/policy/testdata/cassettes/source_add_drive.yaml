# Cassette for T-S3-004c: source_add Drive branch.
#
# The fixture replays the `AddSources` (`izAoDd`) invocation the
# `SourcesAPI.AddDrive` path issues. The response body is the
# chunked-wire chunk the Go batchexecute parser consumes (one
# wrb.fr frame whose rpc id is `izAoDd`); the result payload is
# the freshly added source row (medium-nested shape — outer[0]
# is the entry row, the entry itself is `[id_envelope, title, …]`)
# so the test exercises the decode path end-to-end.
#
# The Drive branch differs from URL / YouTube / Text in one
# load-bearing way: the wire envelope is a 4-element legacy
# tail `[[sourceSpec], notebook_id, [2], [1, null×8, [1]]]`
# (NOT the fresh TPL template block) — the Drive branch has
# not been migrated to the Gemini-3.5 TPL envelope (per the
# #1546 TODO in `_web/sources/add.py`). The 11-slot spec
# carries the `[fileID, mimeType, 1, title]` quad at slot 0
# (the Drive-branch discriminator).
#
# The request body is the URL-encoded `f.req=…` form the
# batchexecute protocol expects. The decoded payload is the
# 11-slot Drive-branch spec at slot 0 ([fileID, mimeType, 1,
# title] quad at source-spec slot 0, source-type code at
# source-spec slot 10), the notebook id at slot 1, the
# literal `[2]` at slot 2, and the legacy `[1, null×8, [1]]`
# tail at slot 3.
#
# Header values are single-string maps because the go-vcr v4 cassette
# struct unmarshals headers as map[string][]string — a scalar value
# is rejected with "cannot construct !!str into []string".
---
version: 2
interactions:
  - request:
      method: POST
      url: https://notebooklm.google.com/_/LabsTailwindUi/data/batchexecute
      headers:
        Cookie:
          - SCRUBBED
        Content-Type:
          - application/x-www-form-urlencoded
      body: 'f.req=%5B%5B%5B%22izAoDd%22%2C%5B%5B%5B%5B%22file-id-abc123%22%2C%22application%2Fvnd.google-apps.document%22%2C1%2C%22My%20Doc%22%5D%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2C1%5D%5D%2C%22nb-1%22%2C%5B2%5D%2C%5B1%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2Cnull%2C%5B1%5D%5D%5D%2Cnull%2Cnull%2Cnull%2C%221%22%5D%5D%5D'
    response:
      code: 200
      headers:
        Content-Type:
          - application/json
      body: |
        [["wrb.fr","izAoDd","[[[\"src-drive\",\"My Doc\",[null,null,null,null,5,null,null,null],[null,2]]]]",null,null,null,"generic"]]